spring.application.name=cart-order-service
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT_CAR_ORDER:8084}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.url=${SPRING_DATASOURCE_URL_CARTORDER_SQL:jdbc:mysql://localhost:3306/cartorderdb?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME_SQL:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD_SQL:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
services.product.base-url=${PRODUCT_SERVICE_URL:http://localhost:8082}
services.inventory.base-url=${INVENTORY_SERVICE_URL:http://localhost:8083}
