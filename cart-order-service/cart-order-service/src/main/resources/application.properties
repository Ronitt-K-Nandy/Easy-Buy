spring.application.name=${CART_ORDER_APPLICATION_NAME}
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT_CAR_ORDER:8080}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.url=${SPRING_DATASOURCE_URL_CARTORDER_SQL:jdbc:mysql://localhost:3306/cartorderdb?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME_SQL:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD_SQL:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#This is name of the service
product.service.id=${PRODUCT_APPLICATION_NAME}
inventory.service.id=${INVENTORY_APPLICATION_NAME}
services.inventory.base-url=${INVENTORY_SERVICE_URL:http://localhost:8083}


eureka.client.service-url.defaultZone=http://localhost:${SERVER_PORT_SERVICE_DISCOVERY:8080}/eureka
eureka.instance.preferIpAddress=true