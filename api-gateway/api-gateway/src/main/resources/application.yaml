spring:
  config:
    import: optional:file:.env[.properties],optional:configserver:http://localhost:8079

  profiles:
    active: dev

  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
         discovery:
           locator:
             enabled: false
             lower-case-service-id: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: READ_ONLY

server:
  port: ${SERVER_PORT_API_GATEWAY}
