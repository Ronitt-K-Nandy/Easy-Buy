spring.application.name=inventory-service
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL_INVENTORY_SQL:jdbc:mysql://localhost:3306/inventorydb?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME_SQL:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD_SQL:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
