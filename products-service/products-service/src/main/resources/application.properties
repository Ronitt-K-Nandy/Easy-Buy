spring.application.name=products-service
# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/easyPayProducts?createDatabaseIfNotExist=true&currentSchema=public
spring.datasource.username=<enter username here>
spring.datasource.password=<enter password here>
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# ImageKit
imagekit.public-key=<place public key>
imagekit.private-key=<place private key>
imagekit.url-endpoint=<enter url>
imagekit.folder=/products
